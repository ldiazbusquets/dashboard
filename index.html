<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' https: data:; media-src 'self'; connect-src 'self' https://api.spotify.com https://accounts.spotify.com; base-uri 'none'; form-action 'none'">
<title>Dashboard</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="scene" aria-hidden="true"><div class="aurora"></div></div>
<svg id="brand" class="brand" viewBox="-24 -24 2689 734" aria-hidden="true" hidden>
  <!-- "LDB" outlined from Archivo (width 125, weight 800, letter-spacing .02em): the same lettering as the mark on ldiazbusquets.github.io -->
  <defs>
    <linearGradient id="brand-glass" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.78"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0.5"/>
    </linearGradient>
  </defs>
  <g fill="url(#brand-glass)" stroke="#fff" stroke-opacity="0.5" stroke-width="34" stroke-linejoin="round">
    <path d="M84.5 686V-1.5H288.1V522.1H729.6V686Z"/>
    <path d="M858.5 686V-1.5H1243Q1370.1 -1.5 1461.9 38.2Q1553.8 78 1603.1 154.8Q1652.4 231.5 1652.4 342.5Q1652.4 452.9 1603.1 529.7Q1553.8 606.5 1461.9 646.2Q1370.1 686 1243 686ZM1062.1 535.1H1231.2Q1278.6 535.1 1317.2 522.6Q1355.8 510.2 1384.1 486.8Q1412.3 463.5 1427.5 429.9Q1442.7 396.3 1442.7 353.5V329.9Q1442.7 287.1 1427.5 253.7Q1412.3 220.4 1384.1 197.1Q1355.8 173.7 1317.2 161.6Q1278.6 149.4 1231.2 149.4H1062.1Z"/>
    <path d="M1811.5 686V-1.5H2376.7Q2432.6 -1.5 2477.9 20Q2523.1 41.5 2549.4 79.5Q2575.8 117.5 2575.8 167.9Q2575.8 212.9 2559.7 244.9Q2543.6 276.9 2516.5 296.8Q2489.4 316.6 2456.3 326.5V330.5Q2494.9 338.5 2525.9 359.4Q2557 380.3 2575.1 415.1Q2593.2 449.8 2593.2 500.3Q2593.2 559.4 2564.7 600.8Q2536.2 642.3 2487.9 664.1Q2439.5 686 2380 686ZM2015.1 541.1H2312Q2344 541.1 2364.2 523.6Q2384.5 506.2 2384.5 470.1Q2384.5 451.1 2375.7 435.9Q2367 420.7 2350.1 412.3Q2333.3 403.9 2309.3 403.9H2015.1ZM2015.1 270.1H2295.1Q2318.4 270.1 2334.3 261.7Q2350.3 253.3 2358.9 238Q2367.5 222.7 2367.5 202Q2367.5 172.7 2347.8 155.6Q2328 138.5 2297.9 138.5H2015.1Z"/>
  </g>
</svg>

<main id="lock" class="lock" hidden>
  <form id="lock-form" class="lock-card glass" autocomplete="off">
    <div class="lock-mark" aria-hidden="true"></div>
    <h1>Locked</h1>
    <p class="muted">Enter your passphrase to decrypt the dashboard.</p>
    <label class="sr-only" for="pass">Passphrase</label>
    <input id="pass" type="password" placeholder="Passphrase" autocomplete="current-password" required>
    <label class="check"><input id="remember" type="checkbox" checked> Remember on this device</label>
    <button type="submit" id="unlock-btn">Unlock</button>
    <p id="lock-msg" class="lock-msg" role="alert"></p>
  </form>
</main>

<div id="app" hidden>
  <header class="hero">
    <div>
      <p id="greet" class="eyebrow"></p>
      <h1 id="clock"></h1>
      <p id="today" class="hero-date"></p>
      <p id="weather" class="hero-weather"></p>
    </div>
    <div class="top-actions">
      <button id="scene-next" class="ghost" type="button" hidden>Next scene</button>
      <button id="scene-btn" class="ghost" type="button" hidden>Pause scene</button>
      <button id="refresh" class="ghost" type="button">Refresh</button>
      <button id="lock-btn" class="ghost" type="button">Lock</button>
    </div>
  </header>

  <nav id="links" class="links" aria-label="Quick links" hidden></nav>
  <p id="updated" class="updated"></p>
  <div id="banner" class="banner glass" hidden></div>

  <section class="stats" id="stats" aria-label="Summary"></section>
  <section class="markets" id="markets" aria-label="Markets" hidden></section>

  <div class="grid">
    <div class="col">
      <section class="card glass" id="missing-card">
        <h2>Missing</h2>
        <div id="missing"></div>
      </section>
      <section class="card glass">
        <div class="card-head">
          <h2 id="upcoming-title">Due soon</h2>
          <label class="check small"><input id="hide-done" type="checkbox"> Hide submitted</label>
        </div>
        <div id="upcoming"></div>
      </section>
      <section class="card glass">
        <h2>Announcements</h2>
        <div id="announcements"></div>
      </section>
    </div>
    <div class="col">
      <section class="card glass" id="focus-card">
        <div class="card-head">
          <h2 id="focus-mode">Focus</h2>
          <div id="focus-presets" class="presets"></div>
        </div>
        <div id="focus-time" class="focus-time">25:00</div>
        <div class="bar"><div id="focus-fill"></div></div>
        <div class="controls">
          <button id="focus-toggle" type="button">Start</button>
          <button id="focus-reset" class="ghost" type="button">Reset</button>
          <span class="spacer"></span>
          <span id="focus-count" class="focus-count"></span>
        </div>
      </section>
      <section class="card glass">
        <div class="card-head">
          <h2>To do</h2>
          <button id="todo-clear" class="linkish flat" type="button" hidden>Clear done</button>
        </div>
        <form id="todo-form" class="todo-form" autocomplete="off">
          <label class="sr-only" for="todo-input">New task</label>
          <input id="todo-input" type="text" maxlength="140" placeholder="Add a task and press Enter">
        </form>
        <div id="todos"></div>
      </section>
      <section class="card glass" id="spotify-card">
        <h2>Spotify</h2>
        <div id="spotify"></div>
      </section>
      <section class="card glass">
        <div class="card-head">
          <h2>Calendar</h2>
          <span id="cal-month" class="cal-month"></span>
        </div>
        <div id="cal" class="cal"></div>
        <div id="cal-list"></div>
      </section>
      <section class="card glass">
        <h2>Courses</h2>
        <div id="courses"></div>
      </section>
    </div>
  </div>
</div>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
