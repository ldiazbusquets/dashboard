name: Update dashboard

on:
  schedule:
    - cron: "7,37 * * * *" # every 30 minutes
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write
  actions: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Collect the site files
        run: |
          mkdir -p site
          cp index.html app.js style.css config.js site/
          find videos -maxdepth 1 -type f \( -iname '*.mp4' -o -iname '*.webm' \) -exec cp {} site/ \; 2>/dev/null || true
          (ls site | grep -Ei '\.(mp4|webm)$' || true) | jq -R . | jq -s . > site/videos.json

      - name: Fetch Canvas data and encrypt it
        env:
          CANVAS_BASE_URL: ${{ secrets.CANVAS_BASE_URL }}
          CANVAS_TOKEN: ${{ secrets.CANVAS_TOKEN }}
          DASH_PASSPHRASE: ${{ secrets.DASH_PASSPHRASE }}
          WINDOW_DAYS: "14"
          INCLUDE_GRADES: "false"
        run: node fetch-canvas.mjs

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      # The site package takes a few seconds to register after upload.
      - name: Wait for the upload to register
        run: sleep 20

      - id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retrying
        if: steps.deploy.outcome == 'failure'
        run: sleep 40

      - name: Deploy (second attempt)
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4

      - name: Keep the schedule alive
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh workflow enable update.yml
